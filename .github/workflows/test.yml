# Testler her push/PR'da kosar. Runner windows-latest: uygulama zaten yalnizca
# Windows'ta calisiyor (pywebview + WebView2, os.startfile) ve api.py modul
# duzeyinde `webview` import ediyor — Linux runner'da bunun calisip
# calismayacagi tahmine kalirdi.
name: testler

on:
  push:
    branches: [master]
  pull_request:

jobs:
  pytest:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
